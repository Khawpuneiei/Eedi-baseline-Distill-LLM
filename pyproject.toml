[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "eedi-misconception-baseline"
version = "0.1.0"
description = "Reproducible retrieve-then-rerank baseline for Eedi misconception diagnosis"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate==1.8.1",
  "huggingface-hub==0.36.2",
  "numpy==1.26.4",
  "safetensors==0.5.3",
  "torch==2.5.1",
  "tqdm==4.67.1",
  "transformers==4.52.4",
]

[project.scripts]
eedi-prepare-data = "scripts.prepare_data:main"
eedi-train-retriever = "scripts.train_retriever:main"
eedi-train-reranker = "scripts.train_reranker:main"
eedi-generate-rationales = "scripts.generate_rationales:main"
eedi-evaluate = "scripts.evaluate:main"
eedi-build-report = "scripts.build_report:main"

[tool.setuptools.packages.find]
include = ["eedi_baseline*", "scripts*"]
